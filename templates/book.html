{% extends "layout_client.html" %}
{% block body %}

<h1 style="margin-bottom: 20px; font-size: 28px;">Booking Schedule</h1>

<table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
    <thead>
        <tr style="background-color: #f2f2f2;">
            <th style="border: 1px solid #ccc; padding: 10px;">Day</th>
            <th style="border: 1px solid #ccc; padding: 10px;">Time</th>
            <th style="border: 1px solid #ccc; padding: 10px;">Date</th>
            <th style="border: 1px solid #ccc; padding: 10px;">Status</th>
        </tr>
    </thead>

    <tbody>
        {% for i in Tbooking %}
        <tr>
            <td style="border: 1px solid #ccc; padding: 8px;">{{ i.day }}</td>
            <td style="border: 1px solid #ccc; padding: 8px;">{{ i.time }}</td>
            <td style="border: 1px solid #ccc; padding: 8px;">{{ i.date }}</td>
            <td style="border: 1px solid #ccc; padding: 8px;">{{ i.status }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h2 style="margin-top: 25px;">Make a Reservation</h2>

<form action="/my_booking" method="post" style="margin-top: 20px;">

    <input name="owner_id" type="hidden" value="{{ owner_id }}">

    <label style="display: block; margin-bottom: 6px;">Select Time:</label>
    <input type="time" name="time" step="1800"
           style="padding: 8px; margin-bottom: 15px; width: 200px;">

    <br>

    <label for="day" style="display: block; margin-bottom: 6px;">Choose a day:</label>
    <select name="day" id="day" class="form-control"
            style="padding: 8px; width: 200px; margin-bottom: 15px;">
        <option value="Sunday">Sunday</option>
        <option value="Monday">Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
        <option value="Thursday">Thursday</option>
        <option value="Friday">Friday</option>
        <option value="Saturday">Saturday</option>
    </select>

    <br>

    <button type="submit"
            style="padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px;">
        Make Reservation
    </button>

</form>

{% endblock %}
